name: Semana 05 - Persistencia y sincronización idempotente

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas existentes
        run: npm test
      - name: Probar contratos CSR y SSR
        run: npm run test:rendering
      - name: Probar contrato del Service Worker
        run: npm run test:service-worker
      - name: Probar persistencia y sincronización
        run: npm run test:sync
      - name: Compilar aplicación
        run: npm run build
      - name: Verificar estructura
        run: npm run verify
      - name: Check público
        run: bash public-tests/check.sh
      - name: Guardar evidencia estructural disponible
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week-05-sync-reports
          if-no-files-found: warn
          path: reports/verification.json
