# Generated by engineering-professor. This workflow is formative feedback.
# Do not use a student-editable workflow as the sole final grading authority.
name: Academic Evaluation Feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: AC-01 - Instalación limpia y build completan.
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          npm run build

      - name: AC-02 - Los artefactos declarados para la actividad existen.
        shell: bash
        run: |
          set -euo pipefail
          test -e 'src/lib/device/camera.ts'
          test -e 'src/lib/device/geolocation.ts'
          test -e 'src/lib/notifications/client.ts'
          test -e 'docs/capabilities.md'
          test -e 'tests/capabilities.spec.ts'

      - name: AC-03 - Ejecutar pruebas existentes.
        run: npm test

      - name: Probar capacidades del dispositivo.
        run: npm run test:capabilities

      - name: Probar contrato del Service Worker.
        run: npm run test:service-worker

      - name: Probar contratos CSR y SSR.
        run: npm run test:rendering

      - name: Probar persistencia y sincronización.
        run: npm run test:sync

      - name: Verificar estructura y generar reporte.
        run: npm run verify

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-evidence-w06-device-push
          if-no-files-found: ignore
          path: |
            evaluation-result.json
            coverage/
            test-results/
            reports/verification.json
