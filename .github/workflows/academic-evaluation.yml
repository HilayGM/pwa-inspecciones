name: Academic Evaluation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Gate 1 - reproducible install
        run: npm ci

      - name: Gate 2 - required artifacts
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "tests/unit"
            "tests/integration"
            "tests/e2e/critical-path.spec.ts"
            "docs/test-strategy.md"
            "README.md"
            "evidence/individual.md"
            ".github/workflows/academic-evaluation.yml"
          )
          for artifact in "${required[@]}"; do
            if [[ ! -e "$artifact" ]]; then
              echo "::error::Falta el artefacto obligatorio: $artifact"
              exit 1
            fi
          done
          echo "Artefactos obligatorios presentes."

      - name: Gate 3 - production build
        run: npm run build

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Gate 4 - test suites
        run: npm test

      - name: Verificar artefactos del proyecto
        run: npm run verify

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-evidence-w08-testing-ci
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            reports/verification.json
